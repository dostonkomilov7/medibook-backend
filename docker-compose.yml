services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    ports: 
      - ${PORT}:${PORT}
    env_file:
      - .env
    depends_on:
      - postgres
  
  postgres:
    image: postgres:latest
    restart: always
    ports: 
      - "5433:5432"
    environment: 
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postresql

volumes:
  postgres_data: