services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    ports: 
      - "${PORT}:${PORT}"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:latest
    restart: always
    ports: 
      - "5433:5432"
    environment: 
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: